{%extends "../layout.html"%}

{%block contenu%}
<section class="centrer">
	<h2>Choisir un nouveau mot de passe</h2>
	{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Modifier mon mot de passe</button>
    </form>
	{% else %}
    	<p style="color: red;">Le lien de réinitialisation est invalide ou a expiré.</p>
	{% endif %}
</section>
{%endblock%}
